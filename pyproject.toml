[project]
name = "agent-memory-eval"
version = "0.1.0"
description = "How LLM agent memory systems work, traced call by call"
requires-python = ">=3.11"
dependencies = [
    "mem0ai>=0.1.100",
    # The notebooks import only its prompts and constants; the experiment runs
    # the real library against Neo4j.
    "graphiti-core>=0.30",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbconvert>=7.16",
    "pandas>=2.2",
    "numpy>=1.26",
    "graphviz>=0.20",
]

[project.optional-dependencies]
# The LongMemEval experiment under src/memeval. Exact versions, so a re-run
# measures the same systems; see docs/experiment.md.
experiment = [
    "google-genai==2.31.0",
    "rank-bm25==0.2.2",
    # The nlp extra is spaCy, which Mem0 uses for entity boosting and
    # lemmatised keyword search; without it both silently switch off.
    "mem0ai[nlp]==2.2.1",
    "spacy==3.8.16",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastembed==0.9.0",
    "qdrant-client==1.19.1",
    "honcho-ai==2.6.0",
    "graphiti-core[google-genai]==0.31.1",
    "neo4j==6.4.1",
    "letta-client==1.12.1",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
