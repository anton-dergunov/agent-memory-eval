name: Render notebooks to Pages

# The committed notebooks already contain their outputs, so this only converts
# them to HTML — nothing is executed and no API keys are needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Lectern's latest commit on main, fetched afresh on every run, so the site
      # picks up each improvement to the reader. A lectern change shows up here at
      # the next push, or on "Run workflow".
      # Title, description and what to leave out are in lectern.toml.
      - name: Render notebooks
        run: uvx --refresh-package lectern --from "git+https://github.com/anton-dergunov/lectern@main" lectern build . -o _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
